[package]
name = "tome"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.19"
bitflags = "2.13.2"
rand = { version = "0.9", features = ["small_rng"] }
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
