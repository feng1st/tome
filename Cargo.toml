[package]
name = "tome"
version = "0.1.0"
edition = "2021"

[dependencies]
# The debug feature fills in real component/system names in engine
# warnings (e.g. hierarchy warning B0004); remove it once diagnosed.
bevy = { version = "0.19", features = ["debug"] }
bitflags = "2.13.2"
rand = "0.9"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
