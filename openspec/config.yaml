schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  **语言与表达原则**（最高优先级，先于本文件其他一切约定）:
  - 协作完全依赖文字，表达清楚无歧义是第一要务。
  - 沟通与所有文档用地道汉语表达。严禁翻译腔，严禁自造词——
    必须符合中国大陆语文书写要求、只能采用惯用中文术语；如果英文术语原词更常用，直接用原词。
  - 语言黑名单见 ~/.agents/language-blacklist.txt（裸行 = 拦，! 前缀 = 放，# = 注释）；对话、文档、注释一律按它自查；确需新造词先经用户确认。
  - 写完任何文档或产物，先按黑名单全量 grep 自查再交付。
  - 代码、标识符、代码注释一律用英文。
  - 注释是必需的，不是可选项：每个文件、每个公开类型、每个系统都必须有
    doc comment 说明职责；不显然的决策点必须有行内注释。
  - 注释粒度：解释“为什么”和不显然的不变量（模型、约束、设计点），
    不复述代码在做什么。分支级一句说决策点；自明的调用不注释。
  - 代码注释自解释，不体现 PD、ToME2 等参考对象的存在（不提及其类名、
    文件名、"原版"）；与参考对象的对应关系只出现在 SDD（spec-driven
    development，openspec/ 下）产物里。
  - SDD 产物、注释、代码、测试一律写成最终状态，不带补丁感：
    只描述现在是什么，不得出现“改为 A 而非 B”“不再是 B”这类补丁描述，不得无故强调“A”好像历史实现并不是A一样。
  - config 只放稳定原则，不放具体逻辑——机制名、文件名、域名等
    会随实现腐烂的细节归 SDD 产物与代码，不写进本文件。

  项目: tome — 用 Bevy (Rust) 重实现 Pixel Dungeon 类 roguelike，PC 桌面平台，鼠标为主、键盘为辅。
  Tech stack: Rust, Bevy 0.19 (钉住 0.19.x；升级引擎须走独立 change)。

  参考项目（本工作区内的参考仓库，只读参考，不在其中改代码）:
  - .ref/pixel-dungeon/ — 原版 Pixel Dungeon v1.9.1 Java/Android 源码 (GPLv3)。
    用途: 游戏机制与数值的第一手参考（地形、动画帧定义、移动/寻路手感）；
    assets/ 下的素材原型阶段可复制进本工程，未来会统一替换。
  - .ref/PD-classes/ — PD 引擎层 (noosa) 反编译类，渲染/动画底层机制参考。
  - .ref/tome2/ — ToME2 C 源码，词汇与机制考证参考（地形定义、生物词汇等
    roguelike 传统惯例）。
  - .ref/tome2-specs/ — ToME2 全量现状 spec 语料（对 .ref/tome2 的完整分析产物：
    91 个 capability 的 OpenSpec 规格，每条结论带 .ref/tome2 源码行号锚点）。
    按源文件定位 spec 用 00-inventory.md；机制与数值细节不复抄，以锚点处源码为准。
  - .ref/bevy/ — Bevy 官方仓库本地 checkout (v0.19.1 tag)，重点参考 examples/
    (2d/sprite_animation.rs, 2d/2d_viewport_to_world.rs, 2d/pixel_grid_snap.rs 等)。
    注意: 工程依赖用 crates.io 的 bevy，本地 checkout 仅供读代码。
  - .ref/bevy-website/content/learn/quick-start/getting-started/ —
    Bevy 官方入门文档 (apps/ecs/plugins/resources/setup)，核心概念的第一手参考。
    写 design 时须体现这些概念的运用。摘要:

    ECS: 全部游戏逻辑的组织方式。
    - Entity: 游戏对象的唯一 ID，本身无数据。
    - Component: 普通 Rust struct（derive Component），拆小拆碎以便复用
      （如 Position、Name 各自独立），挂在 entity 上组合出对象。
    - System: 普通 Rust 函数，靠参数声明数据依赖（Query<&A, &mut B>、Res<T>、
      ResMut<T>、Commands 等），Bevy 按依赖自动调度。系统默认并行执行；
      有先后要求的必须显式 .chain() 或排序，否则顺序不保证。
    - Startup schedule 里的系统只跑一次（生成初始对象用 Commands::spawn），
      Update schedule 每帧循环。

    Plugin: 模块化手段，引擎功能和游戏功能都是插件。插件实现 Plugin trait 的
    build(&self, app) 方法，在里面注册自己的资源/系统；游戏按功能域拆成多个插件，
    main() 只负责装配（DefaultPlugins 提供渲染/窗口/输入等引擎功能）。

    Resource: 全局唯一的数据（时间、素材集合、地图数据等），derive Resource，
    系统里用 Res<T>/ResMut<T> 访问。Entity+Component 表达可查询的对象群体，
    Resource 表达独一份的数据，二者分工明确。

  架构原则:

  插件三层分类：
  - 游戏内核不拆插件：游戏功能是一个整体，不通过插件拆分、组织。
  - 可整体替换的实现抽成插件：内核持有协议，插件单向依赖内核。前端（输入和显示）是插件。
  - 可选功能（DLC 式子系统）做成插件：目前不涉及。
  - 依据：Bevy 的 Plugin 是编译期装配单元（`fn(&mut App)` 天然实现 Plugin），
    不是运行时可热插拔组件；插件间没有依赖声明机制，耦合全部落在共享类型上。

  域组织规范：
  - 按域分目录，域持有自己的 ECS 要素。
  - 域内按 ECS 侧面分子目录（不是 .rs 单文件）：components/（组件）、
    resources/（资源）、entities/（entity 生成）、systems/（系统）、
    utils/（纯函数）、constants/（跨文件复用的枚举与常量）、
    types/（纯值类型，无 ECS 角色）。文件再小也按此落位；
    侧面目录内部按主题再分具名文件。
  - 枚举、常量归属：跨文件复用的放 constants/；只被一处使用、私有的，
    放在归属类型（resource/entity/component）的同一个文件里。
  - mod.rs 只写 mod 声明和 register 函数，不放其他内容；内容一律在具名 .rs
    文件里。统一标准，避免日后“从 mod.rs 抽取内容”的返工。
  - 文件单一职责：一个文件只放同一侧面的同一主题；跨侧面的内容必须拆文件。
  - 开闭原则：新增同类对象（怪物、地形、动画）只允许新增文件/域，
    不允许改动现有结构。会被多类对象使用的通用能力及时下沉为独立域
    （如 movement、animation）。
  - register：域的 mod.rs 里定义 pub fn register(app: &mut App)（裸函数即 Plugin），
    只做成员注册（资源、消息、系统入集合），不做编排；编排（.chain()、
    configure_sets、门控）只在 core/、frontend/input/、frontend/display/
    的根模块（mod.rs）与装配层（main()）。若将来出现子域，
    其 register 由父域的 register 调用。
  - 归属判定：操作单域数据→归该域；通用数据→utils 或外部 crate；多域数据→
    归"结果域"，依赖方向单向无环；两域对称融合→抽新域；纯编排→装配层。
    例：读 core 的身份组件、向前端实体写展示组件的系统，操作多域数据且
    产出的组件属前端 → 归前端的结果域。

  设计原则：
  - 面向终局设计：阶段内容可以少，结构必须对。为已知的演进方向预留扩展点，
    但不为假想需求写实现。
  - 迭代取材原则：新能力的终局形态拆成组成项后，一次迭代只落两类——
    基础项（缺了它能力不成立）与支撑系统已存在的项；支撑系统不存在的
    项一律不进本次迭代。公式因此缺项时，用设计定死的固定值顶替，并在
    design 产物里记录顶替值与终局来源的对应关系。
    例：终局 HP = 初始值 + 出身影响 + 等级成长 + 道具加成 + 状态加成；
    项目已有出身系统时，本次 HP 只落“初始值 + 出身影响”，等级、道具、
    状态的贡献在各自系统落地前一概不出现。
  - 开闭原则：新增同类对象只允许新增文件/域，不允许修改既有结构。
  - 单一职责：一个文件/域只承担一个主题；机制与业务分离。
  - 依赖倒置：多自注册、少显式调用——机制不 import 业务，业务向机制注册。
    自注册的对象主要是资源、消息等数据类要素。例外：系统编排具有全局性、
    依赖相关、顺序相关，必须在 core/、frontend/input/、frontend/display/
    的根模块统一编排，不下放给各域；域/组的 register 只做成员注册（资源、消息、
    系统入集合），不做编排。
  - 值入组件：游戏基于 ECS。实体运行期所需的一切数值在出生时从内容词表
    解析进组件（如词表里的速度解析为移动组件的 speed 字段）；运行期
    系统只读组件，不回查词表注册表。词表注册表的职责封顶于内容的解析、
    校验与出生期解析。例外：展示侧的共享只读播放数据（如动画帧表）——
    同类实体共享一份，克隆进组件是浪费，运行期按句柄直查。
  - 文件即契约：一个数据文件允许多个解析者各读各的部分；解析视图归
    读取方（本域类型只声明自己读取的字段），共享字段的一致性由跨解析
    一致性测试锁定。例：怪物词表文件被怪物注册表全条目解析、被 unique
    注册表只读 unique_id 一列。
  - 命名考究：风格统一、单复数原则一致、无歧义。
  - 单测与 spec 对齐：spec 的可测 requirement 由对应单测锁定，单测即
    requirement 被满足的证据；行为变更先改 spec，单测同步跟进。
  - 延期工作与已知问题统一登记在 openspec/OPEN_ISSUES.txt，不以 FIXME
    注释形式散落代码中；开新 change 前先查该表是否已有相关条目。

# Per-artifact rules
rules:
  proposal:
    - "保存 proposal 前必须用 grilling 方法向用户做问题澄清（design tree 分轮提问，每题给推荐答案），澄清结论须反映到 proposal 中"
  design:
    - "保存 design 前必须用 grilling 方法向用户做问题澄清，澄清结论须反映到 design 中"
    - "重要概念、结构、流程必须用 mermaid 或 plantuml 画图，不得以纯文字描述、ASCII图代替"
    - "关键设计须注明参考来源（例如 pixel-dungeon HeroSprite.java、bevy examples/2d/sprite_animation.rs）"
  tasks:
    - "每个任务须带可验证的 verify 条件（测试、命令或可观察行为）"

# Per-operation guidance
operations:
  apply:
    guidance:
      - "严格按域组织规范落位文件，不图一时方便把内容塞进错误的侧面"
      - "get 纪律：get 只用于可失败查找（返回 Option/Result），对齐 std（HashMap::get）；必然成功的访问器以被取物命名（如 CurrentMap::map），不设 find/get 分工"
      - "值类型归属：纯值类型一律落 types/，不得寄生在 resource/entity/component 文件里"
      - "参数命名：参数名取类型的完整蛇形名（terrain_registry、current_map、local_map），不省略——省略带来泛化歧义与未来同名冲突。豁免：同类型对称参数（如 heuristic(a, b) 这类比较/几何函数）与引擎原语的语义名（如 cursor: Vec2 不叫 vec2）"
      - "字段与参数顺序：标识（key）字段在前、值字段在后；可变（&mut）参数列在只读参数之后——以数据可变性为准，不看形参的 mut 绑定：MessageReader 属读侧、MessageWriter 属写侧；Commands 惯例居首"
      - "提交前必须全绿（零警告）：`cargo +nightly fmt --check`（rustfmt.toml 含 nightly-only 选项）、`cargo clippy --all-targets`、`cargo check --all-targets`、`cargo test`"
